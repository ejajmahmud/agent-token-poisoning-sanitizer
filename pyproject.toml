[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-token-poisoning-sanitizer"
version = "0.1.0"
description = "Glitch token and adversarial unicode normalizer eliminating token boundary manipulation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-token-poisoning-sanitizer = "agent_token_poisoning_sanitizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_token_poisoning_sanitizer*"]
